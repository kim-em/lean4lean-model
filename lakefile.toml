name = "lean4lean-model"
defaultTargets = ["Lean4LeanModel"]

[[require]]
name = "lean4lean"
git = "https://github.com/kim-em/lean4lean"
rev = "b5944782aeec1ccffb041da7ab1331fcc855aef2"

# Mathlib is required last on purpose: where two dependencies pin a shared transitive dependency
# (batteries) differently, the later require wins, and mathlib's pin is the one that matters --
# its olean cache is keyed on its dependency sources, so any other batteries revision makes
# `lake exe cache get` compute wrong hashes and fall back to a from-source mathlib build.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "Lean4LeanModel"
